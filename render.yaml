# Render Blueprint for the PUBLIC DEMO (synthetic data only). Free plan: sleeps when idle, so it also resets to demo data on wake.
# Open mode: no password, synthetic data only, uploads/deletions/settings switched off, data reset every 12 h.
services:
  - type: web
    name: ap-three-way-match-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_DEMO
        value: "1"
      - key: ENABLE_OCR
        value: "0"
      - key: ENABLE_LLM
        value: "0"
      - key: DEMO_OPEN
        value: "1"
      - key: DEMO_RESET_HOURS
        value: "12"
