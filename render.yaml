# Render Blueprint for the PUBLIC DEMO (synthetic data only). Free plan: sleeps when idle, so it also resets to demo data on wake.
# After creating the service, set DEMO_PASSWORD in the dashboard (it is not stored in this file).
services:
  - type: web
    name: ap-three-way-match-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_DEMO
        value: "1"
      - key: ENABLE_OCR
        value: "0"
      - key: ENABLE_LLM
        value: "0"
      - key: DEMO_PASSWORD
        sync: false
